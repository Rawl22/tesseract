name: Translate PDF

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pymupdf pdfplumber pillow pytesseract deep-translator reportlab

      - name: Ready
        run: echo "Workflow base ready"
